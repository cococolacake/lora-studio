name: Idea or feature request
description: Something that would make LoRA Studio nicer to use.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like LoRA Studio to do, and what would it help you with?
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, mock-ups or examples from other tools are welcome.
