name: Bug report
description: Something isn't working the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this! ♡
        Tip: **Settings → About → Copy diagnostics** puts your versions, system, GPU and the end of the last failed run's log on your clipboard (your name and site logins are left out).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead? Screenshots help a lot.
      placeholder: "I clicked Make dataset with a pixiv link, and…"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can it be reproduced?
      placeholder: |
        1. Open Train
        2. Pick anima_train_network.py
        3. …
  - type: dropdown
    id: area
    attributes:
      label: Where in the app?
      options:
        - Training or the queue
        - Runs and samples
        - Dataset tools
        - Downloading with gallery-dl
        - SwarmUI or ComfyUI
        - Installing or updating sd-scripts
        - Installing, updating or starting the app
        - Something else
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste from Settings → About → Copy diagnostics. If the app won't start, paste what the terminal or `LoRA Studio (debug).bat` shows.
      render: text
    validations:
      required: true
