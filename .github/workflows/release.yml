# Posts a GitHub release when a pull request that bumps the version is merged into main.
#
#   - The version comes from studio/__init__.py, so the release is v<version> ("LoRA Studio <version>").
#   - The notes come from the pull request's "## Release notes" section (see .github/release_notes.py).
#   - If that version already has a release (the PR didn't bump the version), nothing is posted,
#     so small fixes can be merged and released together later.
#
# The in-app updater offers the newest release, so users see the update right after the merge.
name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write   # needed to create the tag and the release

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Write the release notes
        id: notes
        env:   # passed as environment variables so text in the PR can't run as a command
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "version=$(python3 .github/release_notes.py notes.md)" >> "$GITHUB_OUTPUT"

      - name: Post the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.notes.outputs.version }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "v$VERSION already has a release, so nothing was posted. Bump the version in studio/__init__.py to release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh release create "v$VERSION" --target "$SHA" --title "LoRA Studio $VERSION" --notes-file notes.md
          { echo "Posted **LoRA Studio $VERSION**:"; echo; cat notes.md; } >> "$GITHUB_STEP_SUMMARY"
